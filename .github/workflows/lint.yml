name: Lint

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: nightly
          components: rustfmt

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Enter Nix devshell
        uses: nicknovitski/nix-develop@v1.2.1
        with:
          arguments: .#ci-format

      - name: Check formatting
        run: just fmt-check

      - name: Check workflow syntax
        run: actionlint

  clippy:
    name: Clippy and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: stable
          components: clippy

      - name: Install just and cargo-shear
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: just,cargo-shear

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Enter Nix devshell
        uses: nicknovitski/nix-develop@v1.2.1
        with:
          arguments: .#ci

      - name: Run Clippy
        run: just clippy

      - name: Check unused dependencies
        run: cargo +stable shear

  zizmor:
    name: GitHub Actions security
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Scan workflows
        uses: zizmorcore/zizmor-action@v0.8.1
        with:
          advanced-security: false
          annotations: true
