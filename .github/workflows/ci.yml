name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test / stable
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust and nightly Cargo for compiler probes
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.76.0,nightly,stable

      - name: Install just and nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just,cargo-nextest

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - name: Enter Nix devshell
        uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1
        with:
          arguments: .#ci

      - name: Run tests
        run: just test

      - name: Verify release package
        run: cargo +stable package --locked

      - name: Check installation and downstream usage
        run: |
          cargo +stable install --path . --locked --debug --root "$RUNNER_TEMP/cpmv"
          "$RUNNER_TEMP/cpmv/bin/cargo-precise-minimal-versions" \
            --manifest-path examples/serde-type/Cargo.toml \
            --dependency serde \
            --versions 1.0.60 \
            --rustc-toolchain stable \
            --check \
            --report-dir "$RUNNER_TEMP/cpmv-report"

      - name: Upload consumer check diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: consumer-check
          path: ${{ runner.temp }}/cpmv-report/
          if-no-files-found: warn
